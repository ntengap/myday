}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1325; --card:#16213d; --ink:#e9f0ff; --muted:#a3b5da; --line:#2a3a64;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.logo{font-family:var(--display);font-weight:700;font-size:1.7rem;color:var(--blue);letter-spacing:-.5px}
.tag{color:var(--muted);font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:1rem;width:100%}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.sm{padding:10px 14px;width:auto;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

/* date navigator */
.dnav{display:flex;align-items:center;gap:10px}
.dnav .arrow{width:46px;height:46px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;color:var(--blue)}
.dnav .mid{flex:1;min-width:0;text-align:center}
.dnav .date{font-family:var(--display);font-weight:600;font-size:1.25rem;border:0;background:none;color:var(--ink);padding:0}
.dnav .rel{font-size:.8rem;color:var(--muted);font-weight:700}
.dnav .rel button{border:0;background:none;color:var(--blue);font-weight:800;padding:0;text-decoration:underline}

/* progress strip */
.hud{display:flex;align-items:center;gap:14px}
.hud .ringbox{position:relative;width:62px;height:62px;flex:none}
.hud .ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.hud .ringbox circle{fill:none;stroke-width:7}
.hud .ringbox b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.hud .xp{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hud .lv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.hud .lv small{color:var(--muted);font-weight:700}
.streak{display:flex;flex-direction:column;align-items:center;color:var(--flame);font-weight:800;font-family:var(--display);line-height:1}
.streak small{color:var(--muted);font-family:var(--body);font-weight:700;font-size:.7rem}
.bar{height:12px;background:var(--blue-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}

.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid transparent;border-radius:14px;padding:10px 6px;font-family:var(--display);font-weight:600;font-size:1.02rem;background:var(--blue-soft);color:var(--ink);line-height:1.2}
.seg button small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--card)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-weight:700;text-align:left}
.opts button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.sentence{font-size:1.4rem;font-weight:700;line-height:1.7}
.fr{font:inherit;font-weight:800;color:var(--blue);background:var(--blue-soft);border:0;border-radius:8px;padding:0 6px;cursor:pointer}
.play{display:flex;gap:12px;align-items:center;width:100%;background:var(--blue-soft);border:0;border-radius:14px;padding:12px 14px;font-weight:700;color:var(--ink);text-align:left}
.play .dot{width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.reply{border-radius:14px;padding:12px 14px;background:var(--good-soft);font-weight:700}
.reply.soft{background:var(--sun-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--card);font-weight:800;color:var(--muted);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}

.tl{display:flex;flex-direction:column}
.tl button{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line)}

.tl .t{width:62px;flex:none;font-family:var(--display);font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums}
.tl .a{flex:1;min-width:0;font-weight:700}
.tl .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--blue-ink)}
.tl .ck.on{background:var(--good);border-color:var(--good)}
.tl button[aria-pressed="true"] .a{color:var(--blue)}

.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.badge{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.badge .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun)}
.badge.lock{opacity:.55}
.badge.lock .ic{background:var(--blue-soft);color:var(--muted)}
.badge b{font-family:var(--display);font-weight:600;line-height:1.15}
.badge small{color:var(--muted);font-weight:600;line-height:1.3}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .num{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{color:var(--muted);font-size:.82rem;font-weight:700}

.gr{display:block;width:100%;text-align:left;background:var(--blue-soft);border:0;border-radius:14px;padding:12px 14px;font-size:1.1rem;font-weight:700}
.gr small{display:block;color:var(--muted);font-weight:600;font-size:.85rem;margin-top:2px}
.gr .aux{background:var(--blue);color:var(--blue-ink);border-radius:6px;padding:0 6px}
.gr .pp{text-decoration:underline;text-decoration-color:var(--sun);text-decoration-thickness:3px;text-underline-offset:3px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;z-index:5}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(29,95,224,.08)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--muted);font-size:.72rem;font-weight:800;border-radius:12px;flex:1}
.tabs button[aria-current="page"]{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      else if(e.type==='said'){s.said++;if(s.saidBy[e.day]!==undefined)s.saidBy[e.day]++;if(e.ref)refs[e.ref]=(refs[e.ref]||0)+1;days[iso(new Date(e.ts))]=1}
    });

    s.personas=Object.keys(pers).length;
    var d=new Date();d.setHours(0,0,0,0);if(!days[iso(d)])d=addDays(d,-1);
    while(days[iso(d)]){s.streak++;d=addDays(d,-1)}
    s.xp=s.built*XP.built+s.done*XP.done+s.said*XP.said+s.goalDays*XP.goalDay;

  /* Build the [English, French] pieces of one activity in one tense. */
  function timeSeg(t){var p=t.split(':'),h=+p[0],m=+p[1];return ['At '+(h%12||12)+':'+pad(m)+' '+(h>=12?'PM':'AM')+',','À '+h+' h'+(m?' '+pad(m):'')+',']}
  function actSegs(a,tense,fem,time){
    var sub=function(s){return s.replace(/\{e\}/g,fem?'e':'').replace(/\{([^|}]*)\|([^}]*)\}/g,function(_,m,f){return fem?f:m})};
    var v=a.fr,segs=[];

    }else if(tense==='aujourdhui'){

    }else segs.push(["I'm going to",'je vais'],[a.en[2],sub(v[2])]);
    a.obj.forEach(function(o){segs.push([o[0],sub(o[1])])});

    segs.unshift(timeSeg(time||a.t));

  function builderHtml(b,sc){

    var en=S.map(function(s){return s[0]}).filter(Boolean).join(' ')+'.';
    var line=S.map(function(s,i){return i<b.step?'[['+s[1]+']]':s[0]}).filter(Boolean).join(' ')+'.';
    var fr=S.map(function(s){return s[1]}).filter(Boolean).join(' ')+'.';
    var pct=Math.round(b.step/N*100),done=b.step===N,said=has('said',b.key);

      '<button class="play" data-say="'+esc(fr)+'"><span class="dot">'+svg('play',18)+'</span>Listen to the French</button>'+

    if(!log.some(function(e){return e.type==='persona'&&e.key===id})){

    var P=PERSONAS[Math.floor(Math.random()*PERSONAS.length)];

    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=pool[i];pool[i]=pool[j];pool[j]=t}
    var rows=pool.slice(0,5).map(function(k){return [k,ACT[k].t]}).sort(function(a,b){return a[1]<b[1]?-1:1});
    Rs.pid=P.id;Rs.day=TENSES[Math.floor(Math.random()*3)];Rs.rows=rows;Rs.sel=null;Rs.shuffled=true;Br=newB();
  }

  function rRout(){

    var list=rows.map(function(r,i){
      var segs=actSegs(ACT[r[0]],Rs.day,fem,r[1]),ok=has('said',rowKey(i));
      return '<button data-row="'+i+'" aria-pressed="'+(Rs.sel===i)+'"><span class="t">'+r[1]+'</span><span class="a">'+esc(plainEn(segs))+'</span><span class="ck'+(ok?' on':'')+'">'+(ok?svg('check',16):'')+'</span></button>';
    }).join('');
    var title=Rs.shuffled?'Random routine':P.label;
    $('#s-rout').innerHTML=
      '<div class="logo">Routines</div>'+topHtml()+
      '<div class="chips" aria-label="People">'+PERSONAS.map(function(p){return '<button data-pid="'+p.id+'" aria-pressed="'+(!Rs.shuffled&&p.id===Rs.pid)+'">'+p.label+'</button>'}).join('')+'</div>'+
      '<div class="seg">'+TENSES.map(function(k){return '<button data-rday="'+k+'" aria-pressed="'+(k===Rs.day)+'">'+DAYS[k].label+'<small>'+fmtShort(dayDate(k))+'</small></button>'}).join('')+'</div>'+
      (Rs.sel!==null&&Br.segs?builderHtml(Br,'r'):'')+
      '<div class="card"><div class="eyebrow" style="margin-bottom:4px">'+title+(Rs.shuffled?' · '+P.label:'')+(fem?' · feminine endings':'')+'</div><div class="tl">'+list+'</div></div>'+
      '<div class="card stack"><div class="eyebrow">Mix and match</div><div class="chips wrap">'+TYPES.map(function(t){return '<button data-type="'+t[0]+'" aria-pressed="'+(Rs.type===t[0])+'">'+t[1]+'</button>'}).join('')+'</div><button class="btn ghost" data-shuffle="1">Make a random routine</button></div>';
  }

  /* =====================  PATTERNS  ===================== */
  var gTopic='past',gMore=false;
  function gramRow(r,stem){
    var s=stem+', '+r[0]+' '+r[1]+(r[2]?' '+r[2]:'');
    return '<button class="gr" data-say="'+esc(s)+'"><span class="aux">'+r[0]+'</span> <span class="pp">'+r[1]+'</span>'+(r[2]?' '+r[2]:'')+'<small>'+r[3]+'</small></button>';
  }
  function builtFor(dk){return log.filter(function(e){return e.type==='built'&&e.day===dk}).length}
  function rGram(){
    var T=GTOPICS[gTopic],n=builtFor(T.day);
    $('#s-gram').innerHTML=
      '<div class="chips">'+Object.keys(GTOPICS).map(function(k){return '<button data-gt="'+k+'" aria-pressed="'+(k===gTopic)+'">'+GTOPICS[k].chip+'</button>'}).join('')+'</div>'+
      '<h1 style="font-size:1.7rem">'+T.title+'</h1>'+
      '<div class="reply'+(n>=3?'':' soft')+'">'+(n>=3?'You have built '+n+' sentences with '+T.stem+'. Now the pattern will make sense.':'You have built '+n+' sentence'+(n===1?'':'s')+' with '+T.stem+' so far. Build 3 and this will click.')+'</div>'+
      '<div class="card stack"><div class="eyebrow">What you have already used</div>'+T.rows.map(function(r){return gramRow(r,T.stem)}).join('')+(gMore?T.more.map(function(r){return gramRow(r,T.stem)}).join(''):'')+'</div>'+
      '<div class="card stack"><div class="eyebrow">Why?</div><p>'+T.why+'</p><p class="tag">'+T.note+'</p></div>'+
      '<button class="btn" data-more="1">'+(gMore?'Show fewer examples':'See more examples')+'</button>';
  }

  /* =====================  PROGRESS  ===================== */
  function rProg(){
    var s=summary(),have=badgeIds(s);
    $('#s-prog').innerHTML=
      '<div class="logo">Progress</div>'+topHtml()+
      '<div class="row"><div class="card stat"><span class="lbl">Said out loud</span><span class="num">'+s.said+'</span></div><div class="card stat"><span class="lbl">Sentences built</span><span class="num">'+s.built+'</span></div></div>'+
      '<div class="row"><div class="card stat"><span class="lbl">Yesterday</span><span class="num">'+s.saidBy.hier+'</span></div><div class="card stat"><span class="lbl">Today</span><span class="num">'+s.saidBy.aujourdhui+'</span></div><div class="card stat"><span class="lbl">Tomorrow</span><span class="num">'+s.saidBy.demain+'</span></div></div>'+
      '<div class="eyebrow">Badges · '+have.length+' of '+BADGES.length+'</div>'+
      '<div class="badges">'+BADGES.map(function(b){var on=have.indexOf(b.id)>=0;
        return '<div class="badge'+(on?'':' lock')+'"><span class="ic">'+svg(on?b.ic:'lock',20)+'</span><b>'+b.n+'</b><small>'+b.en+'</small></div>'}).join('')+'</div>';
  }

  /* =====================  NAVIGATION  ===================== */
  var LABEL={life:'My day',rout:'Routines',gram:'Patterns',prog:'Progress'};
  var R={life:rLife,rout:rRout,gram:rGram,prog:rProg},SEC={life:'s-life',rout:'s-rout',gram:'s-gram',prog:'s-prog'};
  function go(k,keepScroll){
    cur=k;Object.keys(SEC).forEach(function(x){$('#'+SEC[x]).classList.toggle('hide',x!==k)});
    R[k]();
    document.querySelectorAll('.tabs button').forEach(function(b){var t=b.dataset.go;b.innerHTML=svg(t,24)+'<span>'+LABEL[t]+'</span>';if(t===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
    if(!keepScroll)window.scrollTo(0,0);
  }
  function getB(sc){return sc==='r'?Br:Bd}

  document.addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;var d=t.dataset;
    if(d.say){say(d.say);return}
    if(d.go){go(d.go);return}
    if(d.nav!==undefined){
      var n=+d.nav;
      if(n===0)off=0;else off+=n;
      save('vie_off',off);
      if(n===1){log.push({ts:Date.now(),type:'nav',day:'',ref:iso(refDate()),key:''});save('vie_log',log);toast('Jour suivant · '+fmtLong(refDate()))}
      go(cur,true);say(fmtSpoken(refDate()));return;
    }
    if(d.day){day=d.day;pick=null;Bd=newB();go('life',true);return}
    if(d.pick!==undefined){
      pick=+d.pick;var key='m:'+day+':'+pick;
      Bd={segs:[DAYS[day].stem].concat(DAYS[day].opts[pick].segs),step:0,day:day,key:key,doneLogged:has('done',key)};
      if(!has('built',key))award('built',day,key,'+'+XP.built+' XP');
      go('life',true);return;
    }
    if(d.bstep){
      var b=getB(d.sc);b.step=Math.max(0,Math.min(b.segs.length,b.step+(+d.bstep)));
      if(b.step===b.segs.length&&!b.doneLogged&&!has('done',b.key)){b.doneLogged=true;award('done',b.day,b.key,'+'+XP.done+' XP · phrase terminée')}
      go(cur,true);return;
    }
    if(d.bsaid){var b2=getB(d.sc);if(!has('said',b2.key))award('said',b2.day,b2.key,'+'+XP.said+' XP · bravo !');go(cur,true);return}
    if(d.pat){gTopic=d.pat;gMore=false;go('gram');return}
    if(d.gt){gTopic=d.gt;gMore=false;R.gram();return}
    if(d.more){gMore=!gMore;R.gram();return}
    if(d.pid){pickPersona(d.pid);go('rout',true);return}
    if(d.rday){Rs.day=d.rday;Rs.sel=null;Br=newB();go('rout',true);return}
    if(d.row!==undefined){selectRow(+d.row);go('rout');return}
    if(d.type){Rs.type=d.type;go('rout',true);return}
    if(d.shuffle){shuffle();go('rout');return}
  });
  try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}
  window.__vie={ACT:ACT,PERSONAS:PERSONAS,actSegs:actSegs,TENSES:TENSES};
  go('life');
})();
</script>

</body></html>
